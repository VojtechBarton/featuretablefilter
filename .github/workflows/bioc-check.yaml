# Workflow for Bioconductor checks
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

name: bioc-check

permissions: read-all

jobs:
  bioc-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libglpk-dev libxml2-dev libcurl4-openssl-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::BiocManager
            any::BiocCheck
            any::rcmdcheck
          needs: check

      - name: Install Bioconductor dependencies
        run: |
          BiocManager::install(c("phyloseq", "TreeSummarizedExperiment", "ComplexHeatmap", "BiocStyle", "SingleCellExperiment", "SummarizedExperiment"), update = FALSE, ask = FALSE)
        shell: Rscript {0}

      - name: Build package
        run: R CMD build .
        shell: bash

      - name: Run R CMD check
        run: R CMD check --no-manual *.tar.gz
        shell: bash

      - name: Run BiocCheck
        run: |
          tarball=$(ls *.tar.gz)
          Rscript -e "BiocCheck::BiocCheck('$tarball', no.check.version=TRUE)"
        shell: bash
